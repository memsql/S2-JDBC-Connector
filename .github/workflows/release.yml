---
name: Release & Sign

on:
  push:
    tags:
      - 'v*'
  # TEMPORARY: remove after dry-run testing
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Import GPG key
        run: |
          openssl enc -d -aes-256-cbc -K ${{ secrets.ENCRYPTION_KEY }} \
          -iv ${{ secrets.ENCRYPTION_IV }} -in ci/secring.asc.enc \
          -out ci/secring.asc
          gpg --import ci/secring.asc
      - name: Copy Maven Settings
        run: |
          mkdir -p ~/.m2
          cp ci/settings.xml ~/.m2/settings.xml
      # TEMPORARY: package only (no Maven Central publish) for dry-run testing
      # - name: Release to Maven Central
      #   if: ${{ success() }}
      #   run: mvn -s ci/settings.xml clean deploy -DskipTests -Dsonatype.username=${{ secrets.SONATYPE_USER }} -Dsonatype.password=${{ secrets.SONATYPE_PASSWORD }}
      - name: Build release JARs
        if: ${{ success() }}
        run: mvn -s ci/settings.xml clean package -DskipTests
      - name: Derive release version
        if: ${{ success() }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
            echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi
      - name: Install Jsign
        if: ${{ success() }}
        run: |
          wget https://github.com/ebourg/jsign/releases/download/7.0/jsign_7.0_all.deb
          sudo dpkg -i jsign_7.0_all.deb
      - name: Azure Login
        if: ${{ success() }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign JARs with Jsign
        if: ${{ success() }}
        run: |
          AZURE_ACCESS_TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          JSIGN_JAR=/usr/share/jsign/jsign-7.0.jar
          ENDPOINT="${{ vars.AZURE_SIGNING_ENDPOINT }}"
          ALIAS="${{ vars.AZURE_SIGNING_ACCOUNT }}/${{ vars.AZURE_SIGNING_PROFILE }}"
          for JAR in \
            "target/singlestore-jdbc-client-${{ env.RELEASE_VERSION }}.jar" \
            "target/singlestore-jdbc-client-${{ env.RELEASE_VERSION }}-browser-sso-uber.jar"; do
            jarsigner \
              -J-cp -J"$JSIGN_JAR" -J--add-modules -Jjava.sql \
              -providerClass net.jsign.jca.JsignJcaProvider \
              -providerArg "$ENDPOINT" \
              -keystore NONE \
              -storetype TRUSTEDSIGNING \
              -storepass "$AZURE_ACCESS_TOKEN" \
              -tsa "http://timestamp.acs.microsoft.com" \
              "$JAR" "$ALIAS"
          done
      # The Trusted Signing root is not shipped in the JDK truststore, so without
      # it jarsigner reports the signer and timestamp chains as unverifiable.
      - name: Trust the Azure Trusted Signing root CA
        if: ${{ success() }}
        run: |
          EXPECTED_SHA256="53:67:F2:0C:7A:DE:0E:2B:CA:79:09:15:05:6D:08:6B:72:0C:33:C1:FA:2A:26:61:AC:F7:87:E3:29:2E:12:70"
          curl -fsSL -o msroot2020.crt \
            "https://www.microsoft.com/pkiops/certs/Microsoft%20Identity%20Verification%20Root%20Certificate%20Authority%202020.crt"
          ACTUAL_SHA256=$(openssl x509 -inform DER -in msroot2020.crt -noout -fingerprint -sha256 | cut -d= -f2)
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "Unexpected root CA fingerprint: $ACTUAL_SHA256" >&2
            exit 1
          fi
          keytool -importcert -noprompt \
            -alias microsoft-identity-verification-root-ca-2020 \
            -keystore "$JAVA_HOME/lib/security/cacerts" \
            -storepass changeit \
            -file msroot2020.crt
      - name: Verify signed JARs
        if: ${{ success() }}
        run: |
          jarsigner -verify \
            "target/singlestore-jdbc-client-${{ env.RELEASE_VERSION }}.jar"
          jarsigner -verify \
            "target/singlestore-jdbc-client-${{ env.RELEASE_VERSION }}-browser-sso-uber.jar"
      # TEMPORARY: skipped during dry-run testing
